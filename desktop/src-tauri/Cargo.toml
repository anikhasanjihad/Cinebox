[package]
name = "cinebox-desktop"
version = "1.0.0"
description = "Cinebox desktop"
edition = "2021"

[lib]
name = "cinebox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"

[profile.release]
lto = true
opt-level = "s"
strip = true
